[package]
name = "anvc-desktop"
version = "0.4.10"
description = "The anvc work log as a desktop app"
authors = ["anvc"]
repository = "https://github.com/yodering/ANVC"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anvc_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3"
serde_json = "1.0"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
